name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psprune-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module:
    name: Static analysis, Pester, and verified module ZIP
    uses: RuchirChawdhry/ci-workflows/.github/workflows/powershell-module.yml@2c77b4fe5be2185962830944710d1883c3c610da
    with:
      runs-on: ubuntu-slim
      minimum-powershell-version: '7.6.9'
      manifest-path: src/PSPrune/PSPrune.psd1
      test-path: tests
      artifact-name: psprune-module

  smoke:
    name: Offline five-candidate smoke
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out PSPrune
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PowerShell and install PSComplexity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.6.9') {
            throw "PowerShell >= 7.6.9 required, found $($PSVersionTable.PSVersion)."
          }
          Install-PSResource PSComplexity -Version '0.7.1' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Import-Module PSComplexity -RequiredVersion '0.7.1' -ErrorAction Stop

      - name: Run actual scoring and test-gated replacement with fake candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = & ./scripts/smoke.ps1 -OutFile reports/smoke.json
          if ($native -isnot [pscustomobject]) { throw 'Smoke must emit a native PowerShell object.' }
          if ($native.DryRun.Candidates.Count -ne 5 -or -not $native.Applied.Applied -or
              $native.Rejected.AllPassed) {
            throw 'Invalid native smoke object contract.'
          }
          $roundTrip = $native | ConvertTo-Json -Depth 12 | ConvertFrom-Json
          $artifact = Get-Content -LiteralPath reports/smoke.json -Raw | ConvertFrom-Json
          if ($roundTrip.DryRun.SelectedIndex -ne $artifact.DryRun.SelectedIndex) {
            throw 'JSON opt-in differs from native PowerShell output.'
          }

      - name: Install Pester for real project-suite smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource Pester -Version '6.2.0' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Import-Module Pester -MinimumVersion '6.2.0' -ErrorAction Stop

      - name: Install PSScriptAnalyzer for split-mode candidate checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource PSScriptAnalyzer -Version '1.24.0' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Import-Module PSScriptAnalyzer -ErrorAction Stop

      - name: Validate split-mode function groups and score-gated replacement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = & ./scripts/split-smoke.ps1 -OutFile reports/split-smoke.json
          if ($native -isnot [pscustomobject] -or
              -not $native.Result.applied -or -not $native.CandidatePreserved -or
              -not $native.OutsideFunctionPreserved -or $native.Submitted -ne 5) {
            throw 'Invalid PSPrune v0.3 split-mode smoke contract.'
          }
          $json = $native | ConvertTo-Json -Depth 18 | ConvertFrom-Json
          if ($json.Result.candidates.Count -ne 5) {
            throw 'Split-mode JSON round trip lost group measurements.'
          }

      - name: Validate batch management, five-agent submissions, and manual pruning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = & ./scripts/batch-smoke.ps1 -OutFile reports/batch-smoke.json
          if ($native -isnot [pscustomobject] -or -not $native.Pruned -or
              $native.HistoryCount -ne 1 -or -not $native.Result.Applied) {
            throw 'Invalid native PSPrune v0.2 batch contract.'
          }
          $json = $native | ConvertTo-Json -Depth 16 | ConvertFrom-Json
          if ($json.Result.candidates.Count -ne 5) {
            throw 'Batch JSON round trip lost candidate records.'
          }

      - name: Upload machine-readable smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psprune-smoke-json
          path: |
            reports/smoke.json
            reports/batch-smoke.json
            reports/split-smoke.json
          if-no-files-found: ignore
          retention-days: 7

  dogfood:
    name: Self-analyze PSPrune complexity and Git additions
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install complexity measurement dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource PSComplexity -Version '0.7.1' -Scope CurrentUser -TrustRepository -ErrorAction Stop

      - name: Run PSPrune against PSPrune
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = & ./scripts/self-dogfood.ps1 -BaselineCommit df64f1f82af5a9a3349cf7a3276c104c0434ee07 -CurrentCommit HEAD -OutFile reports/self-dogfood.json
          if ($result -isnot [pscustomobject] -or $result.Project.FunctionCount -lt 1 -or
              $result.Introduced.FunctionCount -lt 1) {
            throw 'Self-dogfood did not generate meaningful complexity reports.'
          }
          if ((Get-Content -LiteralPath reports/self-dogfood.json -Raw | ConvertFrom-Json).Project.FunctionCount -ne
              $result.Project.FunctionCount) {
            throw 'Self-dogfood JSON export differs from native output.'
          }

      - name: Upload self-dogfood complexity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psprune-self-dogfood
          path: reports/self-dogfood.json
          if-no-files-found: ignore
          retention-days: 7

  dogfood_2_split:
    name: Dogfood 2.0 — split Invoke-PSPruneBatch into same-file helpers
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Check out the experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSComplexity, Pester, and PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource PSComplexity -Version '0.7.1' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Install-PSResource Pester -Version '6.2.0' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Install-PSResource PSScriptAnalyzer -Version '1.24.0' -Scope CurrentUser -TrustRepository -ErrorAction Stop

      - name: Run five actual Split candidates through full Pester suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = & ./scripts/dogfood-2-split.ps1 -OutFile reports/dogfood-2-split.json
          if ($result -isnot [pscustomobject] -or
              $result.Submitted -ne 5 -or
              -not $result.ProductionUnchanged -or
              -not $result.OutsideGroupUnchanged -or
              -not $result.Result.validation.all_passed -or
              -not $result.Result.applied -or
              -not $result.Result.improved) {
            throw 'Dogfood 2.0 failed the verified split-mode contract.'
          }

      - name: Upload complete, inspectable split experiment results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psprune-dogfood-2-split
          path: reports/dogfood-2-split.json
          if-no-files-found: warn
          retention-days: 14
