name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psprune-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module:
    name: Static analysis, Pester, and verified module ZIP
    uses: RuchirChawdhry/ci-workflows/.github/workflows/powershell-module.yml@2c77b4fe5be2185962830944710d1883c3c610da
    with:
      runs-on: ubuntu-slim
      minimum-powershell-version: '7.6.9'
      manifest-path: src/PSPrune/PSPrune.psd1
      test-path: tests
      artifact-name: psprune-module

  smoke:
    name: Offline five-candidate smoke
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out PSPrune
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PowerShell and install PSComplexity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.6.9') {
            throw "PowerShell >= 7.6.9 required, found $($PSVersionTable.PSVersion)."
          }
          Install-PSResource PSComplexity -Version '0.7.1' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Import-Module PSComplexity -RequiredVersion '0.7.1' -ErrorAction Stop

      - name: Run actual scoring and test-gated replacement with fake candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = & ./scripts/smoke.ps1 -OutFile reports/smoke.json
          if ($native -isnot [pscustomobject]) { throw 'Smoke must emit a native PowerShell object.' }
          if ($native.DryRun.Candidates.Count -ne 5 -or -not $native.Applied.Applied -or
              $native.Rejected.AllPassed) {
            throw 'Invalid native smoke object contract.'
          }
          $roundTrip = $native | ConvertTo-Json -Depth 12 | ConvertFrom-Json
          $artifact = Get-Content -LiteralPath reports/smoke.json -Raw | ConvertFrom-Json
          if ($roundTrip.DryRun.SelectedIndex -ne $artifact.DryRun.SelectedIndex) {
            throw 'JSON opt-in differs from native PowerShell output.'
          }

      - name: Install Pester for real project-suite smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource Pester -Version '6.2.0' -Scope CurrentUser -TrustRepository -ErrorAction Stop
          Import-Module Pester -MinimumVersion '6.2.0' -ErrorAction Stop

      - name: Validate batch management, five-agent submissions, and manual pruning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = & ./scripts/batch-smoke.ps1 -OutFile reports/batch-smoke.json
          if ($native -isnot [pscustomobject] -or -not $native.Pruned -or
              $native.HistoryCount -ne 1 -or -not $native.Result.Applied) {
            throw 'Invalid native PSPrune v0.2 batch contract.'
          }
          $json = $native | ConvertTo-Json -Depth 16 | ConvertFrom-Json
          if ($json.Result.candidates.Count -ne 5) {
            throw 'Batch JSON round trip lost candidate records.'
          }

      - name: Upload machine-readable smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psprune-smoke-json
          path: |
            reports/smoke.json
            reports/batch-smoke.json
          if-no-files-found: ignore
          retention-days: 7
